<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的生活 · 个人专属</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f5f6fa; --card:#ffffff; --ink:#2d3142; --muted:#8a8f9f;
    --brand:#6c7cf7; --brand-soft:#eef0fe; --green:#34c88a; --red:#f26d6d;
    --orange:#f7a94c; --line:#e8eaf2;
  }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  #app { display:flex; min-height:100vh; }

  /* ===== 侧边导航 ===== */
  nav { width:200px; background:var(--card); border-right:1px solid var(--line); padding:22px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; flex-shrink:0; }
  .logo { font-size:20px; font-weight:700; padding:0 12px 18px; }
  .logo span { color:var(--brand); }
  .nav-item { padding:11px 14px; border-radius:10px; cursor:pointer; color:var(--muted); font-size:14px; margin-bottom:4px; transition:.15s; }
  .nav-item:hover { background:var(--brand-soft); color:var(--brand); }
  .nav-item.active { background:var(--brand); color:#fff; font-weight:600; }
  .nav-foot { margin-top:auto; font-size:11px; color:var(--muted); padding:0 12px; line-height:1.7; }

  /* ===== 主区 ===== */
  main { flex:1; padding:26px 32px 80px; max-width:1080px; }
  .page { display:none; }
  .page.active { display:block; }
  h1.page-title { font-size:22px; margin-bottom:4px; }
  .page-sub { color:var(--muted); font-size:13px; margin-bottom:18px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .card h3 { font-size:15px; margin-bottom:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .row { display:flex; gap:14px; margin-bottom:14px; }
  .row .card { flex:1; margin-bottom:0; }

  button { font-family:inherit; cursor:pointer; }
  .btn { background:var(--brand); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:13px; }
  .btn:hover { opacity:.9; }
  .btn-ghost { background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:13px; color:var(--ink); }
  .btn-ghost:hover { border-color:var(--brand); color:var(--brand); }
  .btn-danger { background:#fff; border:1px solid #f3c2c2; color:var(--red); border-radius:8px; padding:7px 14px; font-size:13px; }
  .btn-mini { background:none; border:none; color:var(--muted); font-size:12px; padding:2px 6px; border-radius:6px; }
  .btn-mini:hover { background:var(--brand-soft); color:var(--brand); }

  input[type=text], input[type=date], input[type=number], textarea, select {
    font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
  }
  input:focus, textarea:focus { outline:2px solid var(--brand-soft); border-color:var(--brand); }

  .muted { color:var(--muted); }
  .small { font-size:12px; }
  .tag { display:inline-block; background:var(--brand-soft); color:var(--brand); border-radius:6px; padding:2px 8px; font-size:12px; }
  .tag.green { background:#e6f7ef; color:#1d9e75; }
  .empty { color:var(--muted); font-size:13px; padding:14px 0; text-align:center; }

  /* 全局保存按钮 */
  #save-bar { position:fixed; right:26px; bottom:22px; display:flex; align-items:center; gap:10px; z-index:40; }
  #global-save { background:var(--brand); color:#fff; border:none; border-radius:24px; padding:11px 22px; font-size:14px; box-shadow:0 4px 14px rgba(108,124,247,.35); }
  #global-save:hover { opacity:.9; }
  #save-tip { font-size:12px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 12px; opacity:0; transition:opacity .3s; }
  #save-tip.show { opacity:1; }

  /* 心情/天气选择 */
  .pick-row { display:flex; gap:10px; }
  .pick-btn { border:2px solid transparent; background:var(--bg); border-radius:10px; padding:8px 10px; font-size:22px; cursor:pointer; text-align:center; min-width:52px; }
  .pick-btn .lbl { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
  .pick-btn.sel { border-color:var(--brand); background:var(--brand-soft); }
  .pick-btn.w { font-size:18px; }

  /* 心情动画 */
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.35) rotate(-8deg)} 70%{transform:scale(.92)} 100%{transform:scale(1)} }
  .pick-btn.pop { animation:pop .5s ease; }
  @keyframes burst { to { transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0; } }
  .particle { position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:70; animation:burst .8s ease-out forwards; }

  /* Apple 闹钟式滚轮选择器 */
  .wheel-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center; z-index:60; }
  .wheel-sheet { background:#fff; border-radius:16px 16px 0 0; padding:14px 18px 22px; width:320px; }
  .wheel-title { text-align:center; font-weight:600; margin-bottom:8px; }
  .wheel-cols { display:flex; justify-content:center; gap:6px; position:relative; }
  .wheel-cols::before { content:""; position:absolute; left:0; right:0; top:72px; height:36px; background:rgba(238,240,254,.45); border-top:1.5px solid var(--brand); border-bottom:1.5px solid var(--brand); pointer-events:none; z-index:0; }
  .wheel-col { height:180px; overflow-y:auto; scroll-snap-type:y mandatory; padding:72px 0; scrollbar-width:none; position:relative; z-index:1; }
  .wheel-col::-webkit-scrollbar { display:none; }
  .wheel-item { height:36px; display:flex; align-items:center; justify-content:center; scroll-snap-align:center; font-size:15px; color:var(--muted); cursor:pointer; min-width:64px; }
  .wheel-item.cur { color:var(--ink); font-weight:600; font-size:17px; }
  .wheel-actions { display:flex; gap:10px; margin-top:12px; }
  .wheel-actions button { flex:1; }

  /* 通用弹窗 */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal-sheet { background:#fff; border-radius:16px; padding:20px 22px; width:560px; max-width:94vw; max-height:86vh; overflow-y:auto; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-weight:600; font-size:16px; }

  /* 时间/时长按钮（点击弹出滚轮） */
  .time-btn { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; color:var(--ink); min-width:78px; text-align:center; font-variant-numeric:tabular-nums; }
  .time-btn:hover { border-color:var(--brand); color:var(--brand); }
  .time-btn.empty { color:var(--muted); }

  /* 任务列表 */
  .task-form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .task-item { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .task-item:last-child { border-bottom:none; }
  .task-item .tm { font-size:12px; color:var(--muted); width:92px; flex-shrink:0; }
  .task-item .tt { flex:1; }
  .task-item.done .tt { text-decoration:line-through; color:var(--muted); }
  .task-item input[type=checkbox] { width:16px; height:16px; accent-color:var(--brand); cursor:pointer; }
  .progress-track { height:8px; background:var(--bg); border-radius:5px; overflow:hidden; margin:8px 0 4px; }
  .progress-fill { height:100%; background:var(--brand); border-radius:5px; transition:width .3s; }

  /* 能量标签 */
  .e-dot { display:inline-block; width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .energy-warn { background:#fdf0ef; border:1px solid #f3c2c2; color:var(--red); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:12px; }

  /* 时间轴 */
  .tl-wrap { position:relative; border:1px solid var(--line); border-radius:12px; background:#fff; overflow:hidden; }
  .tl-allday { padding:8px 14px; border-bottom:1px dashed var(--line); font-size:12px; color:var(--muted); background:#fbfbff; }
  .tl { position:relative; height:1152px; }
  .tl-hour { position:relative; height:48px; border-bottom:1px solid var(--line); cursor:pointer; }
  .tl-hour:hover { background:#fbfbff; }
  .tl-hour .h { position:absolute; left:10px; top:4px; font-size:11px; color:var(--muted); }
  .tl-block { position:absolute; left:70px; right:14px; border-radius:8px; padding:4px 10px; font-size:12px; color:#fff; overflow:hidden; cursor:pointer; z-index:2; }
  .tl-block.done { opacity:.55; text-decoration:line-through; }
  .tl-now { position:absolute; left:0; right:0; height:2px; background:var(--red); z-index:3; }
  .tl-now::before { content:"现在"; position:absolute; right:8px; top:-16px; font-size:11px; color:var(--red); }

  /* 目标 */
  .goal-card .top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .goal-card .name { font-weight:600; flex:1; }
  .goal-card input[type=range] { width:100%; accent-color:var(--brand); }
  .subgoal { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; flex-wrap:wrap; }
  .subgoal.done .sg-t { text-decoration:line-through; color:var(--muted); }
  .subgoal input[type=range] { width:110px; accent-color:var(--brand); }
  .subgoal .sg-pct { font-size:11px; color:var(--muted); width:34px; }

  /* 运动标签 */
  .tag-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tag-chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:5px 14px; font-size:13px; cursor:pointer; }
  .tag-chip:hover { border-color:var(--brand); color:var(--brand); }
  .tag-chip.sel { background:var(--brand); color:#fff; border-color:var(--brand); }

  /* 运动记录条目 */
  .fit-entry { display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13px; flex-wrap:wrap; }
  .fit-entry:last-child { border-bottom:none; }
  .fit-entry .min { margin-left:auto; color:var(--brand); font-weight:600; }

  /* 心情日历 / 通用月历 */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal .wd { text-align:center; font-size:11px; color:var(--muted); padding:4px 0; }
  .cal .day { text-align:center; font-size:12px; padding:8px 0; border-radius:8px; background:var(--bg); cursor:pointer; min-height:34px; }
  .cal .day.blank { background:none; cursor:default; }
  .cal .day.today { outline:2px solid var(--brand); }
  .cal .day .sub { display:block; font-size:10px; margin-top:2px; color:var(--brand); font-weight:600; }
  .day-detail { margin-top:12px; background:var(--bg); border-radius:10px; padding:12px 14px; font-size:13px; }

  /* 心情统计图 */
  .chart { display:flex; align-items:flex-end; gap:6px; height:110px; padding-top:10px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .bar .b { width:100%; border-radius:4px 4px 0 0; background:var(--brand); min-height:3px; }
  .bar .d { font-size:10px; color:var(--muted); }

  /* 统计卡 */
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat .num { font-size:26px; font-weight:700; color:var(--brand); }
  .stat .lbl { font-size:12px; color:var(--muted); margin-top:2px; }

  .memo-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .memo-item:last-child { border-bottom:none; }
  .memo-item .t { flex:1; }

  /* 游戏卡片（大卡） */
  .game-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .game-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; position:relative; min-height:190px; transition:.15s; }
  .game-card:hover { border-color:var(--brand); }
  .game-card .gn { font-weight:600; font-size:17px; margin-bottom:8px; }
  .game-card .gi { font-size:12px; color:var(--muted); line-height:1.8; }
  .game-card .ops { display:flex; align-items:center; gap:6px; margin-top:10px; }
  .fun-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .fun-item:last-of-type { border-bottom:none; }
  .fun-item .c { flex:1; }
  .fun-item.done .c { text-decoration:line-through; color:var(--muted); }

  .rec-card { background:linear-gradient(135deg,#f3f5ff,#fdf6ec); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .rec-card .reason { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div class="logo">我的<span>生活</span></div>
    <div class="nav-item active" data-action="nav" data-page="home">🏠 首页总览</div>
    <div class="nav-item" data-action="nav" data-page="tasks">📋 今日计划</div>
    <div class="nav-item" data-action="nav" data-page="timeline">🕐 时间段</div>
    <div class="nav-item" data-action="nav" data-page="goals">🎯 学习目标</div>
    <div class="nav-item" data-action="nav" data-page="fitness">💪 健身计划</div>
    <div class="nav-item" data-action="nav" data-page="diet">🍚 饮食计划</div>
    <div class="nav-item" data-action="nav" data-page="fun">🎮 游戏娱乐</div>
    <div class="nav-item" data-action="nav" data-page="mood">🌅 清晨心情</div>
    <div class="nav-item" data-action="nav" data-page="settings">⚙️ 数据与设置</div>
    <div class="nav-foot">数据保存在本机<br>刷新/重启不丢失</div>
  </nav>
  <main>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-tasks"></section>
    <section class="page" id="page-timeline"></section>
    <section class="page" id="page-goals"></section>
    <section class="page" id="page-fitness"></section>
    <section class="page" id="page-diet"></section>
    <section class="page" id="page-fun"></section>
    <section class="page" id="page-mood"></section>
    <section class="page" id="page-settings"></section>
  </main>
</div>
<div id="save-bar">
  <span id="save-tip"></span>
  <button id="global-save" data-action="save-all">💾 保存</button>
</div>

<script>
"use strict";
/* ================= 数据层 ================= */
const LS_KEY = "myLifeData";
function blank(){ return { version:1, tasks:{}, goals:[], moods:{}, weather:{}, fitness:{}, diet:{}, fun:{}, memos:[] }; }
function normalize(d){
  const b = blank();
  for(const k of Object.keys(b)){ if(d[k] !== undefined) b[k] = d[k]; }
  b.version = 1;
  return b;
}
function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    if(!d || typeof d !== "object") return blank();
    return normalize(d);
  } catch(e){ return blank(); }
}
let DB = load();
let fileHandle = null;

function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  if(fileHandle) writeToFile();
}
async function writeToFile(){
  try {
    const w = await fileHandle.createWritable();
    await w.write(exportJSON());
    await w.close();
  } catch(e){ /* 文件写入失败不影响本地存储 */ }
}
function exportJSON(){ return JSON.stringify(DB, null, 2); }
function importData(text){
  try {
    const d = JSON.parse(text);
    if(!d || d.version !== 1 || typeof d.tasks !== "object" || !Array.isArray(d.goals)) return false;
    DB = normalize(d);
    save();
    renderAll();
    return true;
  } catch(e){ return false; }
}

/* ================= 工具 ================= */
function pad(n){ return String(n).padStart(2,"0"); }
function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toMin(t){ if(!t) return null; const p=t.split(":"); return (+p[0])*60 + (+p[1]); }
function ask(msg){ return window.confirm(msg); }
function fmtDur(min){ min = Math.max(0, min|0); const h=Math.floor(min/60), m=min%60; return h>0 ? h+" 小时" + (m? " "+m+" 分":"") : m+" 分钟"; }

const MOODS = [
  {level:5, label:"很好", emoji:"😄", color:"#2fbf71"},
  {level:4, label:"不错", emoji:"🙂", color:"#8fd14f"},
  {level:3, label:"一般", emoji:"😐", color:"#f7d54c"},
  {level:2, label:"低落", emoji:"😔", color:"#f7a94c"},
  {level:1, label:"糟糕", emoji:"😢", color:"#f26d6d"}
];
const WEATHERS = { sunny:"☀️ 晴", cloudy:"⛅ 阴", rainy:"🌧️ 雨", snowy:"❄️ 雪" };
const TASK_COLORS = ["#6c7cf7","#34c88a","#f7a94c","#e067b0","#4cb8f7","#9b7ff7"];
const FIT_TAGS = ["跑步","力量","瑜伽","拉伸","游泳","骑行","散步","球类"];
const FIT_PARTS = ["全身","胸","背","腿","肩","手臂","核心","有氧"];
const ENERGY = { high:{label:"高", color:"#f26d6d"}, mid:{label:"中", color:"#f7a94c"}, low:{label:"低", color:"#34c88a"} };
const ENERGY_WARN_AT = 3; // 未完成的高能量任务达到此数量时提醒

/* 常见食物热量估算表（千卡/常见一份，仅供参考） */
const FOOD_KCAL = {
  "鸡胸肉沙拉":300, "番茄豆腐汤":120, "全麦吐司":160, "热汤面":260, "小米粥":90, "燕麦粥":150,
  "鸡胸肉":260, "清蒸鱼":200, "杂粮饭":230, "软米饭":230, "米饭":230, "家常面":220, "面条":220,
  "包子":440, "馒头":220, "白粥":90, "燕麦":150, "鸡蛋":140, "荷包蛋":190,
  "牛奶":130, "豆浆":60, "香蕉":90, "苹果":80, "牛肉":250, "瘦肉":260, "鱼":180,
  "豆腐":120, "青菜":60, "时蔬":60, "沙拉":150, "炒饭":400, "吐司":160, "炖汤":150,
  "红薯":100, "玉米":110, "酸奶":120, "水果":80, "坚果":180, "饼干":200, "蛋糕":350,
  "奶茶":400, "咖啡":30, "可乐":150, "薯片":300, "火锅":600, "汉堡":450, "披萨":500,
  "饺子":400, "馄饨":300, "粥品":150, "咸菜":10, "小菜":30
};
function estimateKcal(text){
  if(!text) return null;
  let total = 0, hit = false, rest = String(text);
  const keys = Object.keys(FOOD_KCAL).sort((a,b)=> b.length - a.length); // 长词优先，避免重复计数
  for(const food of keys){
    if(rest.includes(food)){ total += FOOD_KCAL[food]; hit = true; rest = rest.split(food).join(""); }
  }
  return hit ? total : null;
}
function dietKcalText(d){
  if(!d) return "";
  let sum = 0, any = false, unknown = false;
  [d.breakfast, d.lunch, d.dinner].forEach(p=>{
    if(p && p.trim()){
      const e = estimateKcal(p);
      if(e == null) unknown = true; else { sum += e; any = true; }
    }
  });
  if(!any && !unknown) return "";
  if(any) return `今日摄入估算：约 ${sum} 千卡${unknown ? "（部分食物无法估算）" : ""} · 仅供参考`;
  return "这些食物无法估算卡路里 · 仅供参考";
}

/* ================= AI 推荐引擎（本地规则） ================= */
function recommend(mood, weather){
  if(!mood || !weather) return null;
  const indoor = (weather === "rainy" || weather === "snowy");
  const weatherName = indoor ? (weather === "rainy" ? "雨天" : "雪天") : "";

  const fitOutdoor = {
    5:"充满活力的户外有氧 40 分钟（跑步/骑行/跳绳）",
    4:"户外慢跑或快走 30 分钟",
    3:"户外散步 + 瑜伽拉伸 20 分钟",
    2:"慢走散步 20 分钟 + 深呼吸练习",
    1:"10 分钟轻柔拉伸，晒晒太阳"
  };
  const fitIndoor = {
    5:"室内健身操或跳绳 40 分钟",
    4:"室内健身操 / 原地跑 30 分钟",

function todayTasks(){ return DB.tasks[todayKey()] || []; }
function completionRate(){
  const t = todayTasks();
  if(!t.length) return null;
  const done = t.filter(x=>x.done).length;
  return { done, total:t.length, pct:Math.round(done/t.length*100) };
}
function calcStreak(){
  let s = 0;
  const cur = new Date();
  if(!DB.moods[keyOf(cur)]) cur.setDate(cur.getDate()-1);
  while(DB.moods[keyOf(cur)]){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}
function last14Moods(){
  const arr = [];
  for(let i=13; i>=0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = keyOf(d);
    arr.push({ key:k, label:(d.getMonth()+1)+"/"+d.getDate(), level: DB.moods[k] ? DB.moods[k].level : 0 });
  }
  return arr;
}

function fitDay(k){
  if(!DB.fitness[k] || Array.isArray(DB.fitness[k].entries) === false){
    DB.fitness[k] = { goalMin:60, entries:[] };
  }
  if(DB.fitness[k].goalMin == null) DB.fitness[k].goalMin = 60;
  return DB.fitness[k];
}
function fitTotal(k){ return fitDay(k).entries.reduce((s,e)=> s + Math.max(0, e.minutes|0), 0); }
function funDay(k){
  if(!DB.fun[k]) DB.fun[k] = [];
  DB.fun[k].forEach(f=>{
    if(f.name === undefined) f.name = f.content || "";
    if(!Array.isArray(f.items)){
      f.items = [];
      if(f.minutes !== undefined || f.start){
        f.items.push({ id:uid(), minutes:Math.max(0,f.minutes||0), start:f.start||"", end:f.end||"", done:!!f.done });
      }
      delete f.minutes; delete f.start; delete f.end; delete f.done; delete f.content; delete f.feeling;
    }
  });
  return DB.fun[k];
}

/* ================= 滚轮选择器（Apple 闹钟式） ================= */
const WHEEL_ITEM_H = 36;
function openWheel(opts){
  closeWheel();
  const ov = document.createElement("div");
  ov.className = "wheel-overlay"; ov.id = "wheel-ov";
  const colsHtml = opts.columns.map((c,ci)=>
    `<div class="wheel-col" data-ci="${ci}">${c.values.map((v,i)=>
      `<div class="wheel-item" data-i="${i}">${esc(String(v))}</div>`).join("")}</div>`).join("");
  ov.innerHTML = `<div class="wheel-sheet">
    <div class="wheel-title">${esc(opts.title)}</div>
    <div class="wheel-cols">${colsHtml}</div>
    <div class="wheel-actions">
      <button class="btn-ghost" id="wh-cancel">取消</button>
      <button class="btn" id="wh-ok">确定</button>
    </div></div>`;
  document.body.appendChild(ov);

  function mark(col){
    const i = Math.max(0, Math.round(col.scrollTop / WHEEL_ITEM_H));
    col.querySelectorAll(".wheel-item").forEach(el=> el.classList.toggle("cur", +el.dataset.i === i));
  }
  function scrollCol(col, i){
    if(typeof col.scrollTo === "function"){
      try { col.scrollTo({top:i*WHEEL_ITEM_H, behavior:"smooth"}); } catch(e){ col.scrollTop = i*WHEEL_ITEM_H; }
    } else { col.scrollTop = i*WHEEL_ITEM_H; }
    mark(col);
  }
  opts.columns.forEach((c,ci)=>{
    const col = ov.querySelector(`.wheel-col[data-ci="${ci}"]`);
    col.scrollTop = (c.index||0) * WHEEL_ITEM_H;
    mark(col);
    col.addEventListener("scroll", ()=>{
      clearTimeout(col._wt);
      col._wt = setTimeout(()=> scrollCol(col, Math.round(col.scrollTop/WHEEL_ITEM_H)), 120);
    });
    col.addEventListener("click", e=>{
      const it = e.target.closest(".wheel-item");
      if(it) scrollCol(col, +it.dataset.i);
    });
  });
  ov.querySelector("#wh-cancel").addEventListener("click", closeWheel);
  ov.addEventListener("click", e=>{ if(e.target === ov) closeWheel(); });
  ov.querySelector("#wh-ok").addEventListener("click", ()=>{
    const vals = [...ov.querySelectorAll(".wheel-col")].map(col=>{
      const ci = +col.dataset.ci;
      const i = Math.max(0, Math.min(opts.columns[ci].values.length-1, Math.round(col.scrollTop / WHEEL_ITEM_H)));
      return opts.columns[ci].values[i];
    });
    closeWheel();
    opts.onDone(vals);
  });
}
function closeWheel(){ const o = document.getElementById("wheel-ov"); if(o) o.remove(); }

/* 时间滚轮：时 0-23 + 分 0-59；空值时若有关联的开始时间，则从它起滑 */
function openTimeWheel(btn){
  let initVal = btn.dataset.value;
  if(!initVal && btn.dataset.linkFrom){
    const src = document.querySelector(`[data-key="${btn.dataset.linkFrom}"]`);
    if(src && src.dataset.value) initVal = src.dataset.value;
  }
  const cur = initVal || "08:00";
  const [ch, cm] = cur.split(":");
  const hours = [], mins = [];
  for(let i=0;i<24;i++) hours.push(pad(i));
  for(let i=0;i<60;i++) mins.push(pad(i));
  openWheel({
    title: "选择时间",
    columns: [ {values:hours, index:+ch||0}, {values:mins, index:+cm||0} ],
    onDone(vals){
      btn.dataset.value = vals[0] + ":" + vals[1];
      btn.textContent = btn.dataset.value;
      btn.classList.remove("empty");
    }
  });
}
/* 时长滚轮：小时 0-4 + 分钟 0/10/20/30/40/50（不可能为负） */
function openDurWheel(btn, title){
  const cur = Math.max(0, parseInt(btn.dataset.value || "30", 10));
  const hours = [], mins = ["0","10","20","30","40","50"];
  for(let i=0;i<=4;i++) hours.push(String(i));
  const mi = Math.max(0, mins.indexOf(String(cur % 60)));
  openWheel({
    title: title || "选择时长",
    columns: [ {values:hours.map(h=>h+" 小时"), index:Math.min(4, Math.floor(cur/60))}, {values:mins.map(m=>m+" 分"), index:mi} ],
    onDone(vals){
      const total = Math.max(0, parseInt(vals[0])*60 + parseInt(vals[1]));
      btn.dataset.value = String(total);
      btn.textContent = fmtDur(total);
      btn.classList.remove("empty");
      if(btn.dataset.key === "fit-goal"){
        fitDay(todayKey()).goalMin = total;
        save(); renderAll();
      }
    }
  });
}
function timeBtn(key, val, placeholder, linkFrom){
  const empty = !val;
  return `<button class="time-btn ${empty?"empty":""}" data-action="wheel-time" data-key="${key}" data-value="${esc(val||"")}"${linkFrom?` data-link-from="${linkFrom}"`:""}>${empty?placeholder:esc(val)}</button>`;

function durBtn(key, val){

function playMoodAnim(btn, color){
  btn.classList.remove("pop");
  void btn.offsetWidth;
  btn.classList.add("pop");
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i=0;i<10;i++){
    const p = document.createElement("div");
    p.className = "particle";
    const ang = (Math.PI*2/10)*i + Math.random()*0.5;
    const dist = 46 + Math.random()*36;
    p.style.setProperty("--dx", Math.cos(ang)*dist + "px");
    p.style.setProperty("--dy", Math.sin(ang)*dist + "px");
    p.style.left = cx+"px"; p.style.top = cy+"px";
    p.style.background = color;
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 850);
  }
  setTimeout(()=> btn.classList.remove("pop"), 550);
}

const TL_H = 48;
function renderTimeline(){
  const tasks = todayTasks().filter(t=> toMin(t.start)!=null);
  const allday = todayTasks().filter(t=> toMin(t.start)==null);
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  let hours = "";
  for(let h=0; h<24; h++){
    hours += `<div class="tl-hour" data-action="tl-new" data-hour="${h}"><span class="h">${pad(h)}:00</span></div>`;
  }
  const blocks = tasks.map((t,i)=>{
    const s = toMin(t.start), e = toMin(t.end)!=null ? toMin(t.end) : s+60;
    const top = s/60*TL_H, h = Math.max(20, (e-s)/60*TL_H);
    return `<div class="tl-block ${t.done?"done":""}" data-action="tl-toggle" data-id="${t.id}"
      style="top:${top}px;height:${h}px;background:${TASK_COLORS[i%TASK_COLORS.length]}">
      ${esc(t.start)} ${esc(t.title)}</div>`;
  }).join("");
  $("#page-timeline").innerHTML = `
    <h1 class="page-title">时间段</h1>
    <p class="page-sub">一天 24 小时 · 点击空白时段快速新建 · 点击色块标记完成</p>
    ${allday.length ? `<div class="tl-allday">全天任务：${allday.map(t=>esc(t.title)).join("、")}</div>` : ""}
    <div class="tl-wrap"><div class="tl">
      ${hours}${blocks}
      <div class="tl-now" style="top:${nowMin/60*TL_H}px"></div>
    </div></div>`;
}

function monthCalCells(onDay){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  let cells = "";
  ["日","一","二","三","四","五","六"].forEach(w=> cells += `<div class="wd">${w}</div>`);
  for(let i=0; i<first; i++) cells += '<div class="day blank"></div>';
  for(let d=1; d<=days; d++){
    const dk = y+"-"+pad(m+1)+"-"+pad(d);
    cells += onDay(dk, d, dk===todayKey());
  }
  return { cells, title: y + " 年 " + (m+1) + " 月" };
}

/* ================= 事件处理 ================= */
document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const k = todayKey();

  switch(a){
    case "nav": showPage(el.dataset.page); break;
    case "close-modal": closeModal(); break;

    /* 全局手动保存 */
    case "save-all": {
      save();
      const tip = $("#save-tip");
      const now = new Date();
      tip.textContent = "已保存 ✓ " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
      tip.classList.add("show");
      clearTimeout(tip._t);
      tip._t = setTimeout(()=> tip.classList.remove("show"), 2500);
      break;
    }

    /* 滚轮选择器 */
    case "wheel-time": openTimeWheel(el); break;
    case "wheel-dur": openDurWheel(el, el.dataset.key==="fit-goal" ? "每日运动目标时长" : "选择时长"); break;

    /* 心情 & 天气 */
    case "quick-mood": case "set-mood": {
      const level = +el.dataset.level;
      const mm = MOODS.find(x=>x.level===level);
      DB.moods[k] = { level, note: (DB.moods[k] ? DB.moods[k].note : "") };
      save(); renderAll();
      const nb = document.querySelector(`#page-${currentPage} [data-action="${a}"][data-level="${level}"]`);
      if(nb) playMoodAnim(nb, mm ? mm.color : "#6c7cf7");
      break;
    }
    case "save-mood-note": {
      const note = $("#mood-note").value.trim();
      DB.moods[k] = { level: DB.moods[k] ? DB.moods[k].level : 3, note };
      save(); renderAll(); break;
    }
    case "set-weather": DB.weather[k] = el.dataset.w; save(); renderAll(); break;
    case "cal-day": {
      const dk = el.dataset.date, r = DB.moods[dk];
      $("#mood-view").textContent = r
        ? dk + "：" + MOODS.find(x=>x.level===r.level).emoji + " " + MOODS.find(x=>x.level===r.level).label + (r.note ? " · " + r.note : "")
        : dk + "：没有记录";
      break;
    }

    /* 备忘 */
    case "add-memo": {
      const v = $("#memo-input").value.trim();
      if(!v) break;
      DB.memos.push({id:uid(), text:v, time:Date.now()});
      save(); renderAll(); break;
    }
    case "del-memo":
      if(ask("确定删除这条备忘吗？")){ DB.memos = DB.memos.filter(m=>m.id!==id); save(); renderAll(); }
      break;

    /* 今日计划（日历弹窗） */
    case "task-cal-day": openDayModal(el.dataset.date); break;
    case "m-energy": {
      mEnergy = el.dataset.e;
      document.querySelectorAll('#modal-ov [data-action="m-energy"]').forEach(b=> b.classList.toggle("sel", b.dataset.e===mEnergy));
      break;
    }
    case "m-add-task": {
      const dk = el.dataset.date;
      const title = $("#m-title").value.trim();
      if(!title) break;
      if(!DB.tasks[dk]) DB.tasks[dk] = [];
      DB.tasks[dk].push({
        id: uid(), done: false, energy: mEnergy, title,
        start: document.querySelector('[data-key="m-start"]').dataset.value || "",
        end: document.querySelector('[data-key="m-end"]').dataset.value || "",
        memo: $("#m-memo").value.trim()
      });
      save(); renderAll(); openDayModal(dk); break;
    }
    case "m-edit-task": openTaskEditModal(el.dataset.date, id); break;
    case "back-day-modal": openDayModal(el.dataset.date); break;
    case "m-save-edit": {
      if(!editingTask) break;
      const it = (DB.tasks[editingTask.date]||[]).find(x=>x.id===editingTask.id);
      if(it){
        const title = $("#me-title").value.trim();
        if(title){
          Object.assign(it, {
            title, energy: mEnergy,
            start: document.querySelector('[data-key="me-start"]').dataset.value || "",
            end: document.querySelector('[data-key="me-end"]').dataset.value || "",
            memo: $("#me-memo").value.trim()
          });
          save();
        }
      }
      const dk = editingTask.date;
      editingTask = null;
      renderAll(); openDayModal(dk); break;
    }
    case "copy-yesterday": {
      const dk = el.dataset.date;
      const yd = new Date(dk + "T00:00:00"); yd.setDate(yd.getDate()-1);
      const src = DB.tasks[keyOf(yd)] || [];
      if(src.length){
        if(!DB.tasks[dk]) DB.tasks[dk] = [];
        src.forEach(t=> DB.tasks[dk].push({
          id: uid(), done: false, energy: taskEnergy(t),
          title: t.title, start: t.start||"", end: t.end||"", memo: t.memo||""
        }));
        save(); renderAll();
      }
      openDayModal(dk); break;
    }
    case "del-task": {
      const dk = el.dataset.date || k;
      if(ask("确定删除这条任务吗？")){
        DB.tasks[dk] = (DB.tasks[dk]||[]).filter(t=>t.id!==id);
        save(); renderAll();
        if(modalCtx && modalCtx.type==="day") openDayModal(modalCtx.date);
      }
      break;
    }

    /* 时间轴 */
    case "tl-new": {
      showPage("tasks");
      openDayModal(k);
      const h = pad(+el.dataset.hour);
      setWheelBtn("m-start", h+":00");
      setWheelBtn("m-end", pad(Math.min(23,(+el.dataset.hour)+1))+":00");
      const inp = $("#m-title"); if(inp) inp.focus();
      break;
    }
    case "tl-toggle": {
      const it = (DB.tasks[k]||[]).find(x=>x.id===id);
      if(it){ it.done = !it.done; save(); renderAll(); }
      break;
    }

    /* 目标 */
    case "add-goal": {
      const name = $("#g-name").value.trim();
      if(!name) break;
      DB.goals.push({id:uid(), name, type:$("#g-type").value, deadline:$("#g-deadline").value, progress:0, subgoals:[]});
      save(); renderAll(); break;
    }
    case "del-goal":
      if(ask("确定删除这个目标吗？")){ DB.goals = DB.goals.filter(g=>g.id!==id); save(); renderAll(); }
      break;
    case "add-sub": {
      const g = DB.goals.find(x=>x.id===id);
      const inp = $("#sg-"+id);
      const v = inp.value.trim();
      if(!g || !v) break;
      g.subgoals.push({id:uid(), text:v, done:false, progress:0});
      save(); renderAll(); break;
    }
    case "del-sub": {
      const g = DB.goals.find(x=>x.id===el.dataset.gid);
      if(g){ g.subgoals = g.subgoals.filter(s=>s.id!==id); save(); renderAll(); }
      break;
    }

    /* 健身打卡 */
    case "fit-tag": fitTagSel = el.dataset.tag; renderFitness(); break;
    case "add-fit-entry": {
      const f = fitDay(k);
      const minutes = Math.max(0, parseInt(document.querySelector('[data-key="fit-dur"]').dataset.value || "0", 10));
      const detail = $("#f-detail").value.trim();
      if(minutes === 0 && !detail) break;
      f.entries.push({
        id: uid(), tag: fitTagSel, part: $("#f-part").value,
        detail: detail, reps: $("#f-reps").value.trim(), minutes: minutes
      });
      save(); renderAll(); break;
    }
    case "del-fit-entry": {
      if(ask("确定删除这条打卡记录吗？")){
        const f = fitDay(k);
        f.entries = f.entries.filter(x=>x.id!==id);
        save(); renderAll();
      }
      break;
    }
    case "fit-cal-day": {
      const dk = el.dataset.date;
      const fd = DB.fitness[dk];
      const box = $("#fit-day-detail");
      if(fd && Array.isArray(fd.entries) && fd.entries.length){
        box.style.display = "block";
        box.innerHTML = `<b>${dk}</b> · 共 ${fitTotal(dk)} 分钟<br>` + fd.entries.map(x=>
          `${esc(x.tag)} · ${esc(x.part)} · ${esc(x.detail||"—")} ${esc(x.reps||"")} · ${Math.max(0,x.minutes|0)} 分钟`).join("<br>");
      } else {
        box.style.display = "block";
        box.textContent = dk + "：没有运动记录";
      }
      break;
    }

    /* 饮食日历 */
    case "diet-cal-day": {
      const dk = el.dataset.date;
      const dd = DB.diet[dk];
      const box = $("#diet-day-detail");
      box.style.display = "block";
      box.innerHTML = dd && (dd.breakfast||dd.lunch||dd.dinner)
        ? `<b>${dk}</b><br>🍳 早餐：${esc(dd.breakfast||"—")}<br>🍱 午餐：${esc(dd.lunch||"—")}<br>🍲 晚餐：${esc(dd.dinner||"—")}<br><span style="color:var(--brand)">${dietKcalText(dd)}</span>`
        : dk + "：没有饮食记录";
      break;
    }

    /* 娱乐（弹窗创建卡片 / 弹窗添加记录） */
    case "open-fun-card": openFunCardModal(); break;
    case "m-save-fun-card": {
      const c = $("#mf-name").value.trim();
      if(!c) break;
      funDay(k).push({ id: uid(), name: c, items: [] });
      save(); closeModal(); renderAll(); break;
    }
    case "open-fun-item": openFunItemModal(id); break;
    case "m-save-fun-item": {
      const card = funDay(k).find(f=>f.id===id);
      if(!card) break;
      const minutes = Math.max(0, parseInt(document.querySelector('[data-key="m-fdur"]').dataset.value || "0", 10));
      const start = document.querySelector('[data-key="m-fstart"]').dataset.value || "";
      const end = document.querySelector('[data-key="m-fend"]').dataset.value || "";
      if(minutes === 0 && !start) break;
      card.items.push({ id: uid(), minutes, start, end, done: false });
      save(); closeModal(); renderAll(); break;
    }
    case "del-fun-card":
      if(ask("确定删除这张游戏卡片吗？卡片内的记录也会一起删除。")){
        DB.fun[k] = funDay(k).filter(f=>f.id!==id); save(); renderAll();
      }
      break;
    case "del-fun-item": {
      const card = funDay(k).find(f=>f.id===el.dataset.cid);
      if(card && ask("确定删除这条记录吗？")){
        card.items = card.items.filter(x=>x.id!==id);
        save(); renderAll();
      }
      break;
    }

    /* 数据管理 */
    case "export": {
      try {
        const blob = new Blob([exportJSON()], {type:"application/json"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "我的生活备份-" + k.replace(/-/g,"") + ".json";
        link.click();
      } catch(err){ alert("导出失败，请重试"); }
      break;
    }
    case "bind-file": {
      try {
        fileHandle = await window.showSaveFilePicker({ suggestedName:"我的生活数据.json" });
        await writeToFile();
        renderAll();
      } catch(err){ /* 用户取消 */ }
      break;
    }
    case "clear-all":
      if(ask("确定清空全部数据吗？此操作不可恢复！建议先导出备份。")){
        if(ask("再次确认：真的要删除所有数据吗？")){
          DB = blank(); save(); renderAll(); closeModal();
        }
      }
      break;
  }
});

document.addEventListener("change", e=>{
  const el = e.target.closest("[data-change]");
  if(!el) return;
  const c = el.dataset.change, id = el.dataset.id;
  const k = todayKey();
  switch(c){
    case "toggle-task": {
      const dk = el.dataset.date || k;
      const it = (DB.tasks[dk]||[]).find(x=>x.id===id);
      if(it){
        it.done = el.checked; save(); renderAll();
        if(modalCtx && modalCtx.type==="day") openDayModal(modalCtx.date);
      }
      break;
    }
    case "goal-progress": {
      const g = DB.goals.find(x=>x.id===id);
      if(g){ g.progress = +el.value; save(); renderAll(); }
      break;
    }
    case "sub-toggle": {
      const g = DB.goals.find(x=>x.id===el.dataset.gid);
      const s = g && g.subgoals.find(x=>x.id===id);
      if(s){ s.done = el.checked; if(el.checked) s.progress = 100; save(); renderAll(); }
      break;
    }
    case "sub-progress": {
      const g = DB.goals.find(x=>x.id===el.dataset.gid);
      const s = g && g.subgoals.find(x=>x.id===id);
      if(s){ s.progress = +el.value; s.done = (s.progress >= 100); save(); renderAll(); }
      break;
    }
    case "diet": {
      if(!DB.diet[k]) DB.diet[k] = {breakfast:"", lunch:"", dinner:""};
      DB.diet[k][el.dataset.meal] = el.value.trim();
      save();
      const kcalEl = document.getElementById("diet-kcal");
      if(kcalEl) kcalEl.textContent = dietKcalText(DB.diet[k]); // 只更新热量行，不打断输入
      break;
    }
    case "fun-toggle": {
      const card = funDay(k).find(x=>x.id===el.dataset.cid);
      const it = card && card.items.find(x=>x.id===id);
      if(it){ it.done = el.checked; save(); renderAll(); }
      break;
    }
    case "import-file": {
      const file = el.files && el.files[0];
      if(!file) break;
      const reader = new FileReader();
      reader.onload = ()=>{
        if(importData(reader.result)) alert("恢复成功！");
        else alert("备份文件无效，未做任何更改。");
      };
      reader.readAsText(file);
      break;
    }
  }
});

/* 时间轴"现在"指示线每分钟刷新 */
setInterval(()=>{ if(currentPage==="timeline") renderTimeline(); }, 60000);

/* 暴露给测试 */
window.__app = {
  get DB(){ return DB; },
  recommend, exportJSON, importData, calcStreak, completionRate, todayKey, keyOf,
  showPage, blank, fitDay, fitTotal, funDay, funCardTotal, fmtDur,
  estimateKcal, dietKcalText, openDayModal
};

renderAll();
</script>
</body>
</html>
